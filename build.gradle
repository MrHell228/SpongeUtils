subprojects {
	apply plugin: 'java-library'
	
	repositories {
        jcenter()
		maven {
			name = 'sponge'
			url = 'https://repo.spongepowered.org/repository/maven-public/'
		}
		maven {
			name = "sonatype-oss-snapshots1"
			url = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
		}
		mavenLocal()
    }

	version = project.plugin_version
	group = project.plugin_group
	java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
	
	compileJava.options.encoding = 'UTF-8'
	targetCompatibility = 21
	sourceCompatibility = 21
}

[sub_api, sub_common, sub_vanilla, sub_forge, sub_neoforge].each {
	project(":$it").jar.destinationDirectory = file("$rootDir/artifacts")
}

project(":$sub_api") {
	dependencies {
		// SpongeAPI
		api "org.spongepowered:spongeapi:${spongeapi_version}"
		
		// DataFixerUpper
		api 'com.mojang:datafixerupper:8.0.16'
	}
	
	base.archivesName = project.plugin_name + "-api"
}

project(":$sub_common") {
	//apply plugin: 'com.gradleup.shadow'
	//apply plugin: 'org.spongepowered.gradle.plugin'
	//apply plugin: 'org.spongepowered.gradle.vanilla'
	
	dependencies {
		// SpongeToolsAPI
		implementation project(":$sub_api")
		
		// SpongeCommon
		api "org.spongepowered:sponge:${sponge_version}"
		
		// Mixins
		api 'org.spongepowered:mixin:0.8.7'
		api 'io.github.llamalad7:mixinextras-neoforge:0.4.1'
	}
	
	jar {
		from project(":$sub_api").sourceSets.main.output
		
		manifest {
			attributes(
				"MixinConfigs": "mixins.spongetools.json"
			)
		}
	}
	
	base.archivesName = project.plugin_name + "-common"
}

project(":$sub_vanilla") {
	dependencies {
		api project(":$sub_common")
	}
	
	jar {
		from project(":$sub_api").sourceSets.main.output
		from project(":$sub_common").sourceSets.main.output
	}
	
	base.archivesName = project.plugin_name + "-vanilla"
}

project(":$sub_forge") {
	dependencies {
		api project(":$sub_common")
	}
	
	jar {
		from project(":$sub_api").sourceSets.main.output
		from project(":$sub_common").sourceSets.main.output
	}
	
	base.archivesName = project.plugin_name + "-forge"
}

project(":$sub_neoforge") {
	dependencies {
		api project(":$sub_common")
	}
	
	jar {
		from project(":$sub_api").sourceSets.main.output
		from project(":$sub_common").sourceSets.main.output
	}
	
	base.archivesName = project.plugin_name + "-neoforge"
}
